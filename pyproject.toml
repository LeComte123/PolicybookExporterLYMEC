[project]
name = "lymec-policybook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pymupdf>=2.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
